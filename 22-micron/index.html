<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>REINLAND 22 µ Film</title>
<meta name="description" content="REINLAND 22 µ silage wrap film: same film, one more bale. Work out your saving and get today's price on WhatsApp.">
<meta name="theme-color" content="#F6F7F9">
<link rel="canonical" href="https://www.aaryaplastopet.com/22-micron/">
<meta property="og:title" content="REINLAND 22 µ — Same film. One more bale.">
<meta property="og:description" content="Work out how much film, how many rolls and how many extra bales REINLAND 22 µ gives you.">
<meta property="og:image" content="https://www.aaryaplastopet.com/22-micron/assets/drop-poster.jpg">
<!-- same Google Analytics property as the main site -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-YE4GGVNF2N"></script>
<script>window.dataLayer = window.dataLayer || []; function gtag(){dataLayer.push(arguments);} gtag('js', new Date()); gtag('config', 'G-YE4GGVNF2N');</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Noto+Sans+Tamil:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#132A40; --navy-2:#1E3A57; --navy-deep:#0D1F31; --blue:#5468E8; --blue-2:#6F80EE;
    --grey:#9A978F; --paper:#F6F7F9; --card:#FFFFFF; --line:#DDE0E5; --muted:#7C818A; --ghost:#E4E7EB;
    --ease:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.34,1.56,.64,1);
    --gut:20px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
  body{background:var(--paper);color:var(--navy);font-family:Montserrat,'Noto Sans Tamil',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;overflow-x:hidden}
  html[lang=ta] body{font-family:'Noto Sans Tamil',Montserrat,system-ui,sans-serif}
  img,svg,video{display:block;max-width:100%}
  button,input{font:inherit;color:inherit}
  .wrap{max-width:1080px;margin:0 auto;padding:0 var(--gut)}
  .num{font-family:Montserrat,sans-serif;font-variant-numeric:tabular-nums}
  .eyebrow{font-size:12px;font-weight:700;letter-spacing:.28em;color:var(--grey);text-transform:uppercase}
  html[lang=ta] .eyebrow{letter-spacing:0;font-size:14px}
  h1,h2{font-weight:800;letter-spacing:-.03em;line-height:1.02}
  html[lang=ta] h1, html[lang=ta] h2{letter-spacing:-.01em;line-height:1.2}
  /* Tamil words run longer: one size down so the headline keeps to two lines */
  html[lang=ta] .hero h1{font-size:clamp(30px,7.4vw,64px)}
  html[lang=ta] h2{font-size:clamp(25px,5vw,40px)}
  h2{font-size:clamp(30px,6vw,48px)}

  /* language swap: fade text out, swap, fade in */
  [data-t]{transition:opacity .18s ease}
  .swapping [data-t]{opacity:0}

  /* ---------- header ---------- */
  header{position:sticky;top:0;z-index:20;background:rgba(246,247,249,.86);backdrop-filter:saturate(1.4) blur(10px);
    -webkit-backdrop-filter:saturate(1.4) blur(10px);transition:box-shadow .3s ease}
  header.scrolled{box-shadow:0 1px 0 var(--line)}
  header .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
  header img{height:32px;width:auto}
  .lang{position:relative;display:flex;background:var(--ghost);border-radius:999px;padding:3px}
  .lang button{position:relative;z-index:1;border:0;background:none;cursor:pointer;font-size:13px;font-weight:700;
    padding:7px 13px;border-radius:999px;min-width:58px;transition:color .25s ease}
  .lang button[aria-pressed=true]{color:#fff}
  .lang .pill{position:absolute;top:3px;bottom:3px;left:3px;border-radius:999px;background:var(--navy);
    transition:transform .4s var(--ease),width .4s var(--ease)}

  /* ---------- hero ---------- */
  .hero{padding:36px 0 0}
  .hero .tag{display:inline-flex;align-items:baseline;gap:10px}
  .hero .tag b{font-family:Montserrat;font-weight:800;font-size:15px;letter-spacing:.02em;color:var(--blue)}
  .hero h1{font-size:clamp(42px,10vw,84px);margin-top:14px}
  .hero h1 span{display:block;color:var(--blue)}
  .hero .lede{margin-top:18px;max-width:520px;font-size:17px;line-height:1.5;font-weight:500;color:#3C4A5A}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;cursor:pointer;text-decoration:none;
    background:var(--navy);color:#fff;font-weight:700;font-size:16px;padding:16px 26px;border-radius:14px;
    transition:transform .25s var(--ease),background .25s ease,box-shadow .25s ease;-webkit-tap-highlight-color:transparent}
  .btn:hover{background:var(--navy-2);box-shadow:0 10px 24px -12px rgba(19,42,64,.6)}
  .btn:active{transform:scale(.97)}
  .btn svg{width:18px;height:18px;transition:transform .3s var(--ease)}
  .btn:hover svg.down{transform:translateY(3px)}
  .hero .btn{margin-top:26px}
  #iso{width:100%;max-width:900px;height:auto;margin:22px auto 0}

  /* iso scene choreography — transform + opacity only */
  #iso .fade{opacity:0;transition:opacity .7s ease}
  #iso .bale{opacity:0;transform:translate(-26px,-15px)}
  #iso .pop{opacity:0;transform:translateY(10px)}
  #iso.play .fade{opacity:1}
  #iso.play .bale{animation:rollIn .8s var(--ease) forwards;animation-delay:var(--d)}
  #iso.play .bale.xtra{animation:rollInX 1s var(--spring) forwards;animation-delay:var(--d)}
  #iso.play .pop{animation:popUp .7s var(--spring) forwards,bob 3.2s ease-in-out infinite;animation-delay:var(--d),calc(var(--d) + .7s)}
  /* redrawn after a language swap: already in place, no replay */
  #iso.still .fade,#iso.still .bale,#iso.still .pop{opacity:1;transform:none;animation:none}
  #iso.still .pop{animation:bob 3.2s ease-in-out infinite}
  @keyframes rollIn{to{opacity:1;transform:none}}
  @keyframes rollInX{0%{opacity:0;transform:translate(-26px,-15px)}60%{opacity:1}100%{opacity:1;transform:none}}
  @keyframes popUp{to{opacity:1;transform:none}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

  /* stat strip */
  .strip{display:grid;grid-template-columns:repeat(3,1fr);border-top:2px solid var(--navy);margin-top:18px}
  .cell{padding:18px 0 4px}
  .cell + .cell{padding-left:16px;border-left:1px solid var(--line)}
  .cell b{display:block;font-family:Montserrat;font-weight:800;font-size:clamp(26px,6vw,44px);letter-spacing:-.02em;line-height:1}
  .cell b i{font-style:normal;font-size:.5em;font-weight:700;margin-left:3px}
  .cell span{display:block;margin-top:8px;font-size:13px;font-weight:600;color:var(--muted);line-height:1.35}
  .cell.old b{color:#B4B8BE;position:relative;width:max-content}
  .cell.old b::after{content:"";position:absolute;left:-2px;right:-2px;top:52%;height:3px;background:#B4B8BE;border-radius:2px;
    transform:scaleX(0);transform-origin:left;transition:transform .7s var(--ease) .5s}
  .strip.in .cell.old b::after{transform:scaleX(1)}
  .cell.pct b{color:var(--blue)}

  /* ---------- sections ---------- */
  section.block{padding:84px 0 0}
  .head{max-width:640px}
  .head h2{margin-top:12px}
  .head p{margin-top:14px;font-size:17px;line-height:1.55;font-weight:500;color:#3C4A5A}

  /* proof */
  .proof{display:grid;gap:28px;align-items:center}
  .clip{position:relative;border-radius:22px;overflow:hidden;background:var(--navy);aspect-ratio:4/5;max-width:420px;width:100%;
    box-shadow:0 30px 60px -36px rgba(19,42,64,.55)}
  .clip video{width:100%;height:100%;object-fit:cover}
  .clip .badges{position:absolute;left:14px;right:14px;bottom:14px;display:flex;gap:8px;flex-wrap:wrap}
  .clip .badges > span{background:rgba(13,31,49,.78);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff;
    font-weight:700;font-size:13px;padding:8px 12px;border-radius:10px}
  .clip .badges span b{font-family:Montserrat;font-weight:800}
  .ruler{position:absolute;top:14px;bottom:62px;right:16px;width:3px;border-radius:3px;background:rgba(255,255,255,.25);overflow:hidden}
  .ruler i{position:absolute;inset:0;background:#fff;transform:scaleY(0);transform-origin:top;animation:fall 4.6s cubic-bezier(.55,0,.9,.4) infinite}
  @keyframes fall{0%,22%{transform:scaleY(0)}58%{transform:scaleY(1)}100%{transform:scaleY(1);opacity:0}}

  /* calculator */
  .calc{display:grid;gap:22px;margin-top:30px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px}
  .readout{display:flex;align-items:baseline;gap:10px}
  .readout b{font-family:Montserrat;font-weight:800;font-size:64px;letter-spacing:-.03em;line-height:1}
  .readout span{font-weight:600;color:var(--muted);font-size:15px}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:36px;background:none;margin-top:14px;cursor:pointer;touch-action:pan-y}
  input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:8px;
    background:linear-gradient(to right,var(--navy) 0 var(--p),var(--ghost) var(--p) 100%)}
  input[type=range]::-moz-range-track{height:8px;border-radius:8px;background:var(--ghost)}
  input[type=range]::-moz-range-progress{height:8px;border-radius:8px;background:var(--navy)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;margin-top:-11px;border-radius:50%;
    background:#fff;border:3px solid var(--navy);box-shadow:0 4px 12px -4px rgba(19,42,64,.5);transition:transform .2s var(--ease)}
  input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid var(--navy)}
  input[type=range]:active::-webkit-slider-thumb{transform:scale(1.15)}
  .ticks{display:flex;justify-content:space-between;font-family:Montserrat;font-size:12px;font-weight:600;color:var(--muted);margin-top:4px}
  .seg{position:relative;display:inline-flex;background:var(--ghost);border-radius:12px;padding:3px;margin-top:22px}
  .seg button{position:relative;z-index:1;border:0;background:none;cursor:pointer;font-weight:700;font-size:14px;padding:9px 18px;border-radius:9px;
    min-width:96px;transition:color .25s ease}
  .seg button[aria-pressed=true]{color:#fff}
  .seg .pill{position:absolute;top:3px;bottom:3px;left:3px;border-radius:9px;background:var(--navy);transition:transform .4s var(--ease),width .4s var(--ease)}

  .result{background:var(--navy);color:#fff;border:0;position:relative;overflow:hidden}
  .result .eyebrow{color:#A9B4C2}
  .big{display:flex;align-items:baseline;gap:6px;margin-top:10px;flex-wrap:wrap}
  .big b{font-family:Montserrat;font-weight:800;font-size:clamp(52px,12vw,76px);letter-spacing:-.035em;line-height:1}
  .big span{font-weight:700;font-size:18px;color:#C9D0DA}
  .seg.dark{display:flex;width:100%;margin-top:0;background:rgba(255,255,255,.08)}
  .seg.dark button{flex:1;min-width:0;padding:9px 0;color:#C9D0DA}
  .seg.dark button[aria-pressed=true]{color:var(--navy)}
  .seg.dark .pill{background:#fff}
  .fadebox{transition:opacity .16s ease}
  .fadebox.swap{opacity:0}
  .result .big{margin-top:22px}
  .bill{margin-top:18px}
  .bh,.brow{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;column-gap:8px;align-items:baseline}
  .bh span{font-family:Montserrat;font-size:11px;font-weight:700;letter-spacing:.08em;color:#A9B4C2;text-align:right;padding-bottom:6px}
  html[lang=ta] .bh span{letter-spacing:0}
  .bwrap{display:grid;grid-template-rows:1fr;opacity:1;transition:grid-template-rows .45s var(--ease),opacity .3s ease}
  .bwrap.off{grid-template-rows:0fr;opacity:0}
  .bwrap > div{overflow:hidden}
  .brow{padding:12px 0;border-top:1px solid rgba(255,255,255,.12)}
  .brow small{font-size:12px;font-weight:600;color:#A9B4C2;line-height:1.3}
  .brow span{text-align:right;font-weight:700;font-size:clamp(13px,3.6vw,16px);white-space:nowrap}
  .brow .v25{color:#8E9AAB}
  .brow .v22{color:#fff}
  .brow .sv{color:#A5B1FF;font-weight:800}
  /* phones: label on its own line, the three values get the full width */
  @media (max-width:560px){
    .bh,.brow{grid-template-columns:repeat(3,1fr)}
    .bh span:first-child{display:none}
    .brow small{grid-column:1/-1;margin-bottom:6px}
  }

  .more{display:inline-flex;align-items:center;gap:6px;margin-top:18px;border:0;background:none;cursor:pointer;font-weight:700;font-size:14px;color:var(--blue);padding:6px 0}
  .more svg{width:16px;height:16px;transition:transform .35s var(--ease)}
  .more[aria-expanded=true] svg{transform:rotate(180deg)}
  .drawer{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--ease)}
  .drawer.open{grid-template-rows:1fr}
  .drawer > div{overflow:hidden}
  .mini{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px;padding:8px 2px 2px}
  .mini label{display:block;font-size:12px;font-weight:700}
  .mini .wide{grid-column:1/-1}
  .mini .ctl{margin-top:6px}
  .mini .ctl input{padding:11px 12px;font-size:15px}
  .mini .ctl .pre{padding-left:12px}
  .suf{padding-right:12px;color:var(--muted);font-weight:600;font-size:13px;white-space:nowrap}
  .mini small{display:block;margin-top:5px;font-size:11px;color:var(--muted);font-weight:600}
  input[type=number]{-moz-appearance:textfield}
  input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
  .yard{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:22px}
  .yard i{position:relative;aspect-ratio:1/1.05}
  .yard i svg{position:absolute;inset:0;width:100%;height:100%}
  .yard i .on{clip-path:inset(0 calc(100% - var(--f,0%)) 0 0);transition:clip-path .45s var(--ease)}
  .legend{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:13px;font-weight:600;color:#A9B4C2}
  .legend svg{width:16px;height:17px}
  .note{margin-top:14px;font-size:12px;line-height:1.5;color:var(--muted);font-weight:500}

  /* form */
  .lead{display:grid;gap:26px;margin-top:0}
  .formcard{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px;position:relative;overflow:hidden;
    transition:height .5s var(--ease)}
  .chip{display:flex;align-items:center;gap:10px;background:#EEF0FD;color:var(--navy);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600}
  .chip svg{width:26px;height:26px;flex:none}
  .chip b{font-family:Montserrat;font-weight:800}
  .field{margin-top:16px}
  .field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}
  .field label small{font-weight:600;color:var(--muted)}
  .ctl{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;background:#fff;
    transition:border-color .2s ease,box-shadow .2s ease}
  .ctl:focus-within{border-color:var(--navy);box-shadow:0 0 0 4px rgba(84,104,232,.14)}
  .ctl.bad{border-color:#C2410C;animation:nudge .35s ease}
  @keyframes nudge{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
  .ctl .pre{padding:0 0 0 14px;font-family:Montserrat;font-weight:700;color:var(--muted)}
  .ctl input{flex:1;min-width:0;border:0;outline:0;background:none;padding:14px;font-size:16px;font-weight:600}
  .err{font-size:12px;font-weight:600;color:#C2410C;margin-top:6px;min-height:0;max-height:0;overflow:hidden;opacity:0;
    transition:max-height .3s var(--ease),opacity .2s ease}
  .err.show{max-height:30px;opacity:1}
  #sendErr.show{max-height:60px;margin-top:10px;line-height:1.5}
  .consent{display:flex;gap:12px;align-items:flex-start;margin-top:18px;font-size:13px;line-height:1.45;font-weight:500;color:#3C4A5A;cursor:pointer}
  .consent input{appearance:none;-webkit-appearance:none;flex:none;width:22px;height:22px;border:1.5px solid var(--line);border-radius:7px;
    display:grid;place-items:center;transition:background .2s ease,border-color .2s ease;cursor:pointer;margin-top:1px}
  .consent input::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) scale(0);
    margin-top:-2px;transition:transform .25s var(--spring)}
  .consent input:checked{background:var(--navy);border-color:var(--navy)}
  .consent input:checked::after{transform:rotate(45deg) scale(1)}
  .consent.bad input{border-color:#C2410C}
  .formcard .btn{width:100%;margin-top:20px;background:var(--blue)}
  .formcard .btn:hover{background:#4757D6}
  .spin{width:18px;height:18px;border-radius:50%;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;animation:rot .7s linear infinite;display:none}
  .busy .spin{display:block}.busy .lbl{opacity:.7}
  @keyframes rot{to{transform:rotate(360deg)}}
  .hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
  .stage{transition:opacity .35s ease,transform .5s var(--ease)}
  .stage.out{opacity:0;transform:translateY(-12px);pointer-events:none}
  .done{position:absolute;inset:24px;display:flex;flex-direction:column;justify-content:center;opacity:0;transform:translateY(14px);
    pointer-events:none;transition:opacity .45s ease .15s,transform .6s var(--ease) .15s}
  .done.show{opacity:1;transform:none;pointer-events:auto}
  .tick{width:64px;height:64px}
  .tick circle{stroke-dasharray:180;stroke-dashoffset:180}
  .tick path{stroke-dasharray:40;stroke-dashoffset:40}
  .done.show .tick circle{transition:stroke-dashoffset .7s var(--ease) .25s;stroke-dashoffset:0}
  .done.show .tick path{transition:stroke-dashoffset .45s var(--ease) .8s;stroke-dashoffset:0}
  .done h3{font-size:28px;font-weight:800;letter-spacing:-.02em;margin-top:18px}
  .done p{margin-top:8px;font-size:15px;line-height:1.5;color:#3C4A5A;font-weight:500}
  .done .btn{background:#1F9D55;margin-top:22px}
  .done .btn:hover{background:#198549}

  /* ---------- footer ---------- */
  footer{margin-top:96px;position:relative;height:150px;display:flex;overflow:hidden}
  footer > svg{height:150px;flex:none}
  /* logo sits on the tall navy block at left, number on the low navy band at right */
  footer .f img{position:absolute;left:var(--gut);bottom:22px;height:46px;width:auto}
  footer .f a{position:absolute;right:var(--gut);bottom:0;height:60px;display:flex;align-items:center;gap:12px;color:#fff;text-decoration:none}
  footer .f small{font-size:11px;font-weight:700;letter-spacing:.24em;color:#A9B4C2;text-transform:uppercase}
  @media (max-width:520px){footer .f small{display:none}}
  html[lang=ta] footer .f small{letter-spacing:0;font-size:12px}
  footer .f b{font-family:Montserrat;font-size:19px;font-weight:800}

  /* sticky mobile CTA */
  .dock{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:30;transform:translateY(140%);
    transition:transform .55s var(--ease)}
  .dock.show{transform:none}
  .dock .btn{width:100%;background:var(--blue);box-shadow:0 14px 30px -12px rgba(84,104,232,.7)}

  /* scroll reveal */
  [data-reveal]{opacity:0;transform:translateY(22px);transition:opacity .8s ease,transform 1s var(--ease);transition-delay:var(--rd,0s)}
  [data-reveal].in{opacity:1;transform:none}

  @media (min-width:860px){
    :root{--gut:40px}
    header .wrap{height:76px} header img{height:38px}
    .hero{padding-top:56px}
    .hero .lede{font-size:19px}
    .proof{grid-template-columns:1fr 1fr;gap:64px}
    .proof .clip{justify-self:end}
    .calc{grid-template-columns:1fr 1.1fr;gap:24px;align-items:stretch}
    .panel{padding:32px}
    .lead{grid-template-columns:1fr 1fr;gap:64px;align-items:start}
    .formcard{padding:32px}
    .done{inset:32px}
    .dock{display:none}
    footer .f img{height:56px}
    footer .f b{font-size:24px}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
    html{scroll-behavior:auto}
    [data-reveal],#iso .bale,#iso .pop,#iso .fade{opacity:1!important;transform:none!important}
  }
</style>
</head>
<body>

<header id="top">
  <div class="wrap">
    <img src="assets/reinland.png" alt="REINLAND Silage Wrap Film" width="136" height="32">
    <div class="lang" role="group" aria-label="Language">
      <span class="pill"></span>
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" data-lang="ta" aria-pressed="false">தமிழ்</button>
    </div>
  </div>
</header>

<main>
  <!-- ===== hero ===== -->
  <section class="hero">
    <div class="wrap">
      <div class="tag" data-reveal><span class="eyebrow" data-t="newfilm"></span><b>22 µ</b></div>

// ---------- film maths: same roll weight, 22 µ runs longer ----------
// 25 µ roll = 1,500 m; same weight in 22 µ = 1,500 × 25 / 22 = 1,705 m. 250 mm LLDPE at 0.92 g/cm³.
const ROLL25 = 1500, ROLL22 = ROLL25 * 25 / 22;
const GPM25 = 0.25 * 25 * 0.92, GPM22 = GPM25 * 22 / 25;   // grams per metre: 5.75 / 5.06
const IN = n => n.toLocaleString('en-IN');
const num = (id, dflt) => { const v = parseFloat(document.getElementById(id).value); return v > 0 ? v : dflt; };
const metres = () => num('inMetres', 30), days = () => num('inDays', 30);
const extraPerMonth = d => Math.round(d * days() * (ROLL22 / ROLL25 - 1));   // 200/day → 818

let lang = 'en', per = 'month';
const $ = s => document.querySelector(s);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

function applyCopy() {
  const t = COPY[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach(e => { const v = t[e.dataset.t]; if (typeof v === 'string') e.textContent = v; });
  if (window.render) render(false);
}

// ---------- segmented pills (language + period) ----------
function movePill(group) {
  const on = group.querySelector('[aria-pressed=true]'), pill = group.querySelector('.pill');
  pill.style.width = on.offsetWidth + 'px';
  pill.style.transform = `translateX(${on.offsetLeft - 3}px)`;
}
document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => {
  if (b.dataset.lang === lang) return;
  document.querySelectorAll('.lang button').forEach(x => x.setAttribute('aria-pressed', x === b));
  movePill($('.lang'));
  document.body.classList.add('swapping');
  setTimeout(() => {
    lang = b.dataset.lang; applyCopy(); drawIso(false);
    requestAnimationFrame(() => { movePill($('.seg')); document.body.classList.remove('swapping'); });
  }, 180);
}));
// period switch: the bill fades out, swaps units, fades back in (numbers can't tween from g to kg)
document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
  if (b.dataset.per === per) return;
  per = b.dataset.per;
  document.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-pressed', x === b));
  movePill($('.seg'));
  const box = $('#fadebox');
  box.classList.add('swap');
  setTimeout(() => { render(false); box.classList.remove('swap'); }, reduce ? 0 : 170);
}));

// ---------- smooth number tweens ----------
const tweens = new Map();
function tweenTo(el, to, fmt, animate = true) {
  const cur = tweens.get(el);
  const from = cur ? cur.value : to;
  if (cur) cancelAnimationFrame(cur.raf);
  if (reduce || !animate || from === to) { el.textContent = fmt(to); tweens.set(el, { value: to }); return; }
  const t0 = performance.now(), dur = 520, st = { value: from };
  tweens.set(el, st);
  const step = now => {
    const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
    st.value = from + (to - from) * e;
    el.textContent = fmt(k < 1 ? st.value : to);
    if (k < 1) st.raf = requestAnimationFrame(step); else st.value = to;
  };
  st.raf = requestAnimationFrame(step);
}

// each period is a headline + up to three bill rows of { label, 25 µ, 22 µ, saved, format }
function bill() {
  const t = COPY[lang], d = +slider.value, m = metres(), price = num('inPrice', 0);
  const g25 = m * GPM25, g22 = m * GPM22, b25 = ROLL25 / m, b22 = ROLL22 / m;
  const fG = v => `${v.toFixed(1)} ${t.uG}`;
  const fKg = v => v < 100 ? `${v.toFixed(1)} ${t.uKg}` : `${IN(Math.round(v))} ${t.uKg}`;
  const fM = v => `${IN(Math.round(v))} ${t.uM}`;
  const fN = v => IN(Math.round(v));
  const fRoll = v => v < 1000 ? v.toFixed(1) : IN(Math.round(v));
  const fRs = v => t.uRs + (v < 100 ? v.toFixed(2) : IN(Math.round(v)));
  const plus = f => v => '+' + f(v);
  const cost = (k25, k22) => price ? { l: t.rCost, a: k25 * price, b: k22 * price, s: (k25 - k22) * price, f: fRs } : null;
  if (per === 'bale') return {
    head: { v: g25 - g22, f: fG, t: t.hBale },
    rows: [{ l: t.rLen, a: m, b: m, s: null, f: fM }, { l: t.rWt, a: g25, b: g22, s: g25 - g22, f: fG }, cost(g25 / 1000, g22 / 1000)],
  };
  if (per === 'roll') {
    const n25 = Math.floor(b25), n22 = Math.floor(b22);
    return {
      head: { v: n22 - n25, f: plus(fN), t: t.hRoll },
      rows: [{ l: t.rRollLen, a: ROLL25, b: ROLL22, s: ROLL22 - ROLL25, f: fM, sf: plus(fM) }, { l: t.rBales, a: n25, b: n22, s: n22 - n25, f: fN, sf: plus(fN) }, null],
    };
  }
  const n = d * (per === 'month' ? days() : 1), k25 = n * g25 / 1000, k22 = n * g22 / 1000;
  return {
    head: { v: n * (ROLL22 / ROLL25 - 1), f: plus(fN), t: per === 'month' ? t.hMonth : t.hDay },
    rows: [{ l: t.rKg, a: k25, b: k22, s: k25 - k22, f: fKg }, { l: t.rRolls, a: n / b25, b: n / b22, s: n / b25 - n / b22, f: fRoll }, cost(k25, k22)],
  };
}

// ---------- isometric hero (from the 22 µ poster's iso engine) ----------
const NS = 'http://www.w3.org/2000/svg', scene = $('#scene'), iso = $('#iso');
const C30 = 0.8660254, RAD = Math.PI / 180;
const P = (x, y, z) => [(x - y) * C30, (x + y) * 0.5 - z];
const pts = a => a.map(p => p[0].toFixed(2) + ',' + p[1].toFixed(2)).join(' ');
let target = scene;
function el(tag, attrs, parent = target) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);

}
function group(cls, delay) { const g = el('g', { class: cls }, scene); if (delay != null) g.style.setProperty('--d', delay + 'ms'); target = g; return g; }
const EDGE = { stroke: '#132A40', 'stroke-opacity': .18, 'stroke-width': .8, 'stroke-linejoin': 'round' };
const poly = (a, fill, extra = {}) => el('polygon', { points: pts(a), fill, ...EDGE, ...extra });
const line = (a, b, stroke, w = 1, extra = {}) => el('line', { x1: a[0], y1: a[1], x2: b[0], y2: b[1], stroke, 'stroke-width': w, 'stroke-linecap': 'round', ...extra });
function box(x0, y0, z0, x1, y1, z1, c) {
  poly([P(x0, y0, z1), P(x1, y0, z1), P(x1, y1, z1), P(x0, y1, z1)], c.top);
  poly([P(x1, y0, z0), P(x1, y1, z0), P(x1, y1, z1), P(x1, y0, z1)], c.right);
  poly([P(x0, y1, z0), P(x1, y1, z0), P(x1, y1, z1), P(x0, y1, z1)], c.left);
}
function hull(a) {
  a = a.slice().sort((p, q) => p[0] - q[0] || p[1] - q[1]);
  const cr = (o, p, q) => (p[0] - o[0]) * (q[1] - o[1]) - (p[1] - o[1]) * (q[0] - o[0]);
  const lo = [], up = [];
  for (const p of a) { while (lo.length > 1 && cr(lo[lo.length - 2], lo[lo.length - 1], p) <= 0) lo.pop(); lo.push(p); }
  for (const p of a.slice().reverse()) { while (up.length > 1 && cr(up[up.length - 2], up[up.length - 1], p) <= 0) up.pop(); up.push(p); }
  lo.pop(); up.pop(); return lo.concat(up);
}
const ringY = (cx, cz, y, r, n = 64) => Array.from({ length: n }, (_, i) => { const t = i / n * 2 * Math.PI; return P(cx + r * Math.cos(t), y, cz + r * Math.sin(t)); });
function cylY(cx, cz, y0, y1, r, c) {
  poly(hull(ringY(cx, cz, y0, r).concat(ringY(cx, cz, y1, r))), c.body);
  if (c.sheen) {
    const s = [];
    for (let t = 52; t <= 78; t += 2) s.push(P(cx + r * Math.cos(t * RAD), y0, cz + r * Math.sin(t * RAD)));
    for (let t = 78; t >= 52; t -= 2) s.push(P(cx + r * Math.cos(t * RAD), y1, cz + r * Math.sin(t * RAD)));
    poly(s, '#fff', { 'fill-opacity': c.sheen, stroke: 'none' });
  }
  if (c.bands) for (const t of [12, 105]) line(P(cx + r * Math.cos(t * RAD), y0 + 2, cz + r * Math.sin(t * RAD)), P(cx + r * Math.cos(t * RAD), y1, cz + r * Math.sin(t * RAD)), '#fff', .9, { 'stroke-opacity': c.bands });
  poly(ringY(cx, cz, y1, r), c.cap);
  if (c.crown) {
    for (const a of [20, 80, 140]) { const t = a * RAD;
      line(P(cx + r * .96 * Math.cos(t), y1, cz + r * .96 * Math.sin(t)), P(cx - r * .96 * Math.cos(t), y1, cz - r * .96 * Math.sin(t)), '#fff', 1, { 'stroke-opacity': c.crown }); }
    poly(ringY(cx, cz, y1, r * .26, 32), c.cap, { stroke: '#fff', 'stroke-opacity': c.crown * 1.6 });
  }
  if (c.hub) poly(ringY(cx, cz, y1, r * .5, 32), c.hub);
}
const ringZ = (cx, cy, z, r, n = 64) => Array.from({ length: n }, (_, i) => { const t = i / n * 2 * Math.PI; return P(cx + r * Math.cos(t), cy + r * Math.sin(t), z); });

  if (c.band) poly(arcZ(cx, cy, c.band[0], r, -45, 135).concat(arcZ(cx, cy, c.band[1], r, -45, 135).reverse()), c.band[2], { stroke: 'none' });
  if (c.sheen) poly(arcZ(cx, cy, z0, r, 10, 28).concat(arcZ(cx, cy, z1, r, 10, 28).reverse()), '#fff', { 'fill-opacity': c.sheen, stroke: 'none' });

const FONT = () => lang === 'ta' ? "'Noto Sans Tamil', Montserrat" : 'Montserrat';
function isoText(str, x, y, z, size, fill, weight = 800, anchor = 'start', spacing = 0) {
  const [sx, sy] = P(x, y, z);
  const t = el('text', { transform: `matrix(${C30},.5,${-C30},.5,${sx},${sy})`, 'font-family': FONT(), 'font-weight': weight,

}
function flatText(str, p, size, fill, weight = 800, anchor = 'middle', spacing = 0) {

}
const NAVY = { top: '#2A4766', left: '#132A40', right: '#0D1F31' };
const BODY = { top: '#F1F2EE', left: '#DCDED7', right: '#BFC2B9' };
const BLUE = { top: '#7C8CF0', left: '#5468E8', right: '#3F51C7' };
const SLAB = { top: '#ECEEF1', left: '#D9DCE1', right: '#C6CAD1' };
const TYRE = { body: '#1B2533', cap: '#243142', hub: '#A2A69B' };
const BALE_OLD = { body: '#C3C7CD', cap: '#D4D7DC', sheen: .35, bands: .55, crown: .55 };
const BALE_NEW = { body: '#132A40', cap: '#1E3A57', sheen: .14, bands: .22, crown: .22 };
const BALE_XTRA = { body: '#5468E8', cap: '#6F80EE', sheen: .2, bands: .3, crown: .3 };

const R = 34, D = 2 * R, PITCH7 = 84, L = PITCH7 * 7, LANE_W = 82, BALE_LEN = 62, LA = 0, LB = 150, SX0 = -120, SX1 = L + 190;

function drawMachine(X0, Y0) {
  const M = (x0, y0, z0, x1, y1, z1, c) => box(X0 + x0, Y0 + y0, z0, X0 + x1, Y0 + y1, z1, c);
  poly([P(X0 - 10, Y0 + 2, 0), P(X0 + 282, Y0 + 2, 0), P(X0 + 282, Y0 + 134, 0), P(X0 - 10, Y0 + 134, 0)], '#132A40', { 'fill-opacity': .07, stroke: 'none' });
  M(-70, 56, 30, 0, 66, 37, NAVY);
  cylY(X0 + 112, 27, Y0 - 6, Y0 + 8, 27, TYRE);
  M(10, 10, 40, 262, 112, 50, NAVY);
  M(250, 62, 0, 257, 69, 40, NAVY);
  M(0, 16, 50, 82, 106, 124, BODY);
  poly([P(X0 + 6, Y0 + 22, 124), P(X0 + 76, Y0 + 22, 124), P(X0 + 76, Y0 + 100, 124), P(X0 + 6, Y0 + 100, 124)], '#6F786C');
  poly([P(X0 + 6, Y0 + 22, 124), P(X0 + 76, Y0 + 22, 124), P(X0 + 76, Y0 + 22, 98), P(X0 + 6, Y0 + 22, 98)], '#58614F', { stroke: 'none' });
  M(86, 12, 50, 188, 110, 164, BODY);
  poly([P(X0 + 98, Y0 + 110, 62), P(X0 + 176, Y0 + 110, 62), P(X0 + 176, Y0 + 110, 128), P(X0 + 98, Y0 + 110, 128)], '#E6E8E2');
  for (const x of [112, 128, 144, 160]) line(P(X0 + x, Y0 + 110, 70), P(X0 + x, Y0 + 110, 120), '#132A40', .8, { 'stroke-opacity': .18 });
  poly([P(X0 + 86, Y0 + 110, 138), P(X0 + 188, Y0 + 110, 138), P(X0 + 188, Y0 + 110, 150), P(X0 + 86, Y0 + 110, 150)], '#132A40', { stroke: 'none' });
  poly([P(X0 + 188, Y0 + 12, 138), P(X0 + 188, Y0 + 110, 138), P(X0 + 188, Y0 + 110, 150), P(X0 + 188, Y0 + 12, 150)], '#0D1F31', { stroke: 'none' });
  for (const [x, y] of [[102, 26], [168, 26], [102, 92]]) M(x, y, 164, x + 5, y + 5, 206, NAVY);
  M(100, 24, 202, 175, 30, 207, NAVY); M(100, 24, 202, 106, 98, 207, NAVY);
  for (const x of [116, 130, 144, 158]) M(x, 30, 203, x + 3, 92, 206, BODY);
  M(100, 92, 202, 175, 98, 207, NAVY); M(169, 30, 202, 175, 92, 207, NAVY); M(168, 92, 164, 173, 97, 206, NAVY);
  M(194, 20, 50, 266, 102, 60, NAVY);
  cylY(X0 + 230, 60 + 31, Y0 + 30, Y0 + 92, 31, BALE_NEW);
  M(268, 106, 42, 275, 113, 156, BLUE); M(222, 106, 150, 275, 113, 156, BLUE);
  const fy = Y0 + 122, fx = X0 + 262;
  el('polygon', { points: pts([P(fx - 4, fy - 6, 74), P(X0 + 246, Y0 + 92, 72), P(X0 + 246, Y0 + 92, 110), P(fx - 4, fy - 6, 112)]), fill: '#fff', 'fill-opacity': .55, stroke: '#132A40', 'stroke-opacity': .12, 'stroke-width': .6 });
  cylZ(fx, fy, 70, 118, 10, { body: '#1E3A57', cap: '#2A4766', core: '#9A978F', sheen: .18 });

// slab + film-length ticks (static), then each bale in its own animated group
function lane(y0, n, colour, extra, t0, step) {
  group('fade');
  box(SX0, y0, -10, SX1, y0 + LANE_W, 0, SLAB);
  const pitch = L / n, bY0 = y0 + (LANE_W - BALE_LEN) / 2, bY1 = bY0 + BALE_LEN;
  for (let k = 0; k <= n; k++) line(P(k * pitch, y0 + 6, 0), P(k * pitch, y0 + LANE_W - 6, 0), '#132A40', k % n ? .8 : 1.6, { 'stroke-opacity': k % n ? .22 : .55 });
  for (let i = 0; i < n; i++) {
    const x = extra && i === n - 1;
    group(x ? 'bale xtra' : 'bale', t0 + i * step + (x ? 260 : 0));
    const cx = (i + .5) * pitch;
    poly([P(cx - R * .8, bY0 - 1, 0), P(cx + R * 1.15, bY0 - 1, 0), P(cx + R * 1.15, bY1 + 6, 0), P(cx - R * .8, bY1 + 6, 0)], '#132A40', { 'fill-opacity': .09, stroke: 'none' });

  }
  return { pitch, bY0, bY1 };
}

  flatText(top, [p[0], p[1] - 52], 11, '#8B8F96', 700, 'middle', 2.6);
  flatText(bottom, [p[0], p[1] - 30], 19, colour, 800, 'middle');
}

  drawMachine(-470, 52);

  lane(LA, 6, BALE_OLD, null, 250, 150);
  group('fade');
  roll(-62, LA + LANE_W / 2, { body: '#C3C7CD', cap: '#D4D7DC', core: '#8B8F96', sheen: .35, band: [30, 44, '#B0B4BA'] }, T.rollOld, '25 µ', '#9AA0A8');
  group('pop', 1250);

  try {
    const { db, fs } = await leadsDb();
    await fs.addDoc(fs.collection(db, 'leads'), { ...lead, createdAt: fs.serverTimestamp() });
  } catch (err) {
    console.error('lead not saved', err);
    btn.classList.remove('busy'); btn.disabled = false;
    $('#sendErr').classList.add('show');
    return;
  }
  if (window.gtag) gtag('event', 'generate_lead', { source: '22mic-landing', bales_per_day: lead.balesPerDay });

  const t = COPY[lang], card = $('#formcard');
  card.style.height = card.offsetHeight + 'px';
  $('#thanks').textContent = t.thanks(name.split(' ')[0]);
  $('#wa').href = 'https://wa.me/917483643028?text=' + encodeURIComponent(t.waText(name, slider.value));
  form.classList.add('out');
  $('#done').classList.add('show');
  requestAnimationFrame(() => card.style.height = Math.max($('#done').scrollHeight + 64, 340) + 'px');
});

// ---------- boot ----------
applyCopy();
render();
movePill($('.lang')); movePill($('.seg'));
document.fonts.ready.then(() => { drawIso(!reduce); isoBoot(); movePill($('.lang')); movePill($('.seg')); });
addEventListener('resize', () => { movePill($('.lang')); movePill($('.seg')); });
</script>
</body>
